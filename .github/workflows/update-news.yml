name: 뉴스 자동 업데이트

# 매일 1회 자동 실행 + 필요 시 수동 실행
on:
  schedule:
    - cron: '0 22 * * *'   # 매일 07:00 KST (UTC 22:00)
  workflow_dispatch:        # Actions 탭에서 "Run workflow" 버튼으로 수동 실행

permissions:
  contents: write           # news.json 커밋/푸시 권한

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node 설치
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 네이버 뉴스 수집 → news.json 갱신
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node scripts/fetch-news.js

      - name: 변경 시에만 커밋·푸시
        run: |
          if [[ -n "$(git status --porcelain news.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add news.json
            git commit -m "chore(news): 자동 업데이트 $(date -u +%Y-%m-%d)"
            git push
            echo "news.json 변경 → 커밋·푸시 완료"
          else
            echo "변경 없음 — 커밋 생략"
          fi
